<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<title>GappaChat</title>
<link rel="stylesheet" href="style.css">
<style>
.badge{background:#25d366;color:#fff;border-radius:12px;padding:2px 8px;font-size:12px;font-weight:700}
.row .w{flex:1;min-width:0}.row .w small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{font-size:11px;color:#888;align-self:flex-start}
#add{position:fixed;right:20px;bottom:24px;width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;font-size:28px;box-shadow:0 3px 8px #0004}
header small{display:block;font-size:12px;font-weight:400;opacity:.85}
.day{align-self:center;background:#e1f2fb;color:#555;font-size:12px;padding:3px 10px;border-radius:8px;margin:6px 0}
.bub img{max-width:240px;max-height:300px;border-radius:8px;margin-bottom:3px}
.t3{color:#34b7f1}
.bar label{width:40px;height:46px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
</style>
</head>
<body>
<section id="login" class="screen">
  <img src="icon-512.png" class="logo" alt="">
  <h1>GappaChat</h1>
  <p>Tumche nav aani mobile number taka</p>
  <input id="name" placeholder="Tumche nav" maxlength="30">
  <input id="phone" placeholder="Mobile number" inputmode="numeric" maxlength="15">
  <button id="go">Suru kara</button>
  <small id="err"></small>
</section>
<section id="list" class="screen hidden">
  <header><b><span id="ttl">GappaChat</span><small id="st"></small></b><button id="out" title="Logout">⎋</button></header>
  <input id="search" class="search" placeholder="Shodha...">
  <div id="users"></div>
  <button id="add" title="Navin chat">+</button>
</section>
<section id="chat" class="screen hidden">
  <header><button id="back">←</button><span class="av" id="cav"></span><b><span id="cname"></span><small id="csub"></small></b></header>
  <div id="msgs"></div>
  <div class="bar"><label for="img">📎</label><input id="img" type="file" accept="image/*" hidden><input id="msg" placeholder="Message" autocomplete="off"><button id="send">➤</button></div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* >>> Fakt hi config tumchya Firebase project chi taka <<< */
const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT.firebaseapp.com",
  databaseURL: "https://PASTE_PROJECT-default-rtdb.firebaseio.com",
  projectId: "PASTE_PROJECT",
  appId: "PASTE_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database(), TS = firebase.database.ServerValue.TIMESTAMP;
const $ = id => document.getElementById(id);
const show = id => ['login','list','chat'].forEach(s => $(s).classList.toggle('hidden', s !== id));
const hm = t => new Date(t).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
const ini = n => (n||'?').trim().charAt(0).toUpperCase();
const dayLbl = t => { const d = new Date(t), n = new Date(); if(d.toDateString() === n.toDateString()) return 'Aaj';
  n.setDate(n.getDate()-1); return d.toDateString() === n.toDateString() ? 'Kal' : d.toLocaleDateString(); };
let me = null; try { me = JSON.parse(localStorage.getItem('me')); } catch(e){}
let users = {}, meta = {}, open = null, cref = null, showAll = false, lastDay = '', tTimer;
const cidOf = o => [me.id, o].sort().join('_');
const visible = () => !document.hidden;

function start(){
  show('list');
  db.ref('.info/connected').on('value', s => {
    $('st').textContent = s.val() ? 'online' : 'connecting...';
    if(s.val()){ const r = db.ref('users/' + me.id);
      r.onDisconnect().update({online: false, last: TS}).then(() => r.update({name: me.name, id: me.id, online: true})); }
  });
  db.ref('users').on('value', s => { users = s.val() || {}; renderList(); subtitle(); });
  db.ref('userChats/' + me.id).on('value', s => {
    const nu = s.val() || {};
    Object.keys(nu).forEach(o => {
      const n = nu[o].unread || 0, p = (meta[o] && meta[o].unread) || 0;
      if(n > 0 && open !== o) markDelivered(o);
      if(n > p && (open !== o || !visible()) && 'Notification' in window && Notification.permission === 'granted')
        new Notification((users[o]||{}).name || o, {body: nu[o].last, icon: 'icon-512.png'});
    });
    meta = nu; renderList();
  });
  if('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
}
function markDelivered(o){
  db.ref('chats/' + cidOf(o)).limitToLast(30).once('value', s => s.forEach(c => {
    const m = c.val(); if(m.f !== me.id && m.s < 2) c.ref.update({s: 2}); }));
}
function renderList(){
  if(!me || $('list').classList.contains('hidden')) return;
  const q = $('search').value.toLowerCase(), box = $('users'); box.innerHTML = '';
  $('ttl').textContent = showAll ? 'Navin chat' : 'GappaChat';
  let arr = showAll ? Object.values(users).filter(u => u.id !== me.id).map(u => ({id: u.id}))
    : Object.keys(meta).map(id => ({id, ...meta[id]})).sort((a,b) => (b.ts||0) - (a.ts||0));
  arr = arr.filter(u => { const n = ((users[u.id]||{}).name || u.id).toLowerCase(); return n.includes(q) || u.id.includes(q); });
  if(!arr.length){ box.innerHTML = '<p class="empty">' + (showAll ? 'Konihi nahi. Mitrana app share kara!' : 'Chat nahi. Khali + dabun suru kara.') + '</p>'; return; }
  arr.forEach(u => {
    const nm = (users[u.id]||{}).name || u.id;
    const d = document.createElement('div'); d.className = 'row';
    const a = document.createElement('span'); a.className = 'av'; a.textContent = ini(nm);
    const w = document.createElement('div'); w.className = 'w';
    const n = document.createElement('b'); n.textContent = nm;
    const p = document.createElement('small'); p.textContent = showAll ? u.id : (u.last || '');
    w.append(n, p); d.append(a, w);
    if(!showAll && u.ts){ const t = document.createElement('span'); t.className = 'tm'; t.textContent = hm(u.ts); d.append(t); }
    if(!showAll && u.unread){ const b = document.createElement('span'); b.className = 'badge'; b.textContent = u.unread; d.append(b); }
    d.onclick = () => { showAll = false; openChat(u.id); }; box.append(d);
  });
}
function subtitle(){
  if(!open) return; const u = users[open] || {};
  $('csub').textContent = u.online ? 'online' : (u.last ? 'last seen ' + dayLbl(u.last) + ' ' + hm(u.last) : '');
}
function openChat(o){
  open = o; lastDay = ''; show('chat');
  $('cname').textContent = (users[o]||{}).name || o; $('cav').textContent = ini($('cname').textContent); $('msgs').innerHTML = ''; subtitle();
  cref = db.ref('chats/' + cidOf(o));
  cref.limitToLast(200).on('child_added', s => {
    const m = s.val(); m.k = s.key; addMsg(m);
    if(m.f !== me.id){ if(visible()) { if(m.s < 3) s.ref.update({s: 3}); } else if(m.s < 2) s.ref.update({s: 2}); }
  });
  cref.on('child_changed', s => { const e = document.querySelector('[data-k="' + s.key + '"]'); if(e) tick(e, s.val().s); });
  db.ref('userChats/' + me.id + '/' + o + '/unread').set(0);
  db.ref('typing/' + cidOf(o) + '/' + o).on('value', s => { if(s.val()) $('csub').textContent = 'typing...'; else subtitle(); });
}
function tick(e, s){ e.textContent = s >= 2 ? '✓✓' : '✓'; e.classList.toggle('t3', s >= 3); }
function addMsg(m){
  const box = $('msgs'), dl = dayLbl(m.ts || Date.now());
  if(dl !== lastDay){ lastDay = dl; const x = document.createElement('div'); x.className = 'day'; x.textContent = dl; box.append(x); }
  const d = document.createElement('div'); d.className = 'bub ' + (m.f === me.id ? 'me' : 'they');
  if(m.img){ const im = document.createElement('img'); im.src = m.img; d.append(im); }
  if(m.m){ const t = document.createElement('span'); t.textContent = m.m; d.append(t); }
  const k = document.createElement('i'); k.textContent = hm(m.ts || Date.now()) + ' ';
  if(m.f === me.id){ const c = document.createElement('span'); c.dataset.k = m.k; tick(c, m.s); k.append(c); }
  d.append(k); box.append(d); box.scrollTop = box.scrollHeight;
}
function post(obj, preview){
  const ts = Date.now();
  cref.push({f: me.id, ts: TS, s: 1, ...obj});
  db.ref('userChats/' + me.id + '/' + open).update({last: preview, ts, unread: 0});
  db.ref('userChats/' + open + '/' + me.id).update({last: preview, ts});
  db.ref('userChats/' + open + '/' + me.id + '/unread').transaction(v => (v || 0) + 1);
  db.ref('typing/' + cidOf(open) + '/' + me.id).set(null);
}
function send(){ const v = $('msg').value.trim(); if(!v || !open) return; post({m: v}, v); $('msg').value = ''; }
$('send').onclick = send;
$('msg').onkeydown = e => { if(e.key === 'Enter') send(); };
$('msg').oninput = () => {
  const r = db.ref('typing/' + cidOf(open) + '/' + me.id); r.set(true); r.onDisconnect().remove();
  clearTimeout(tTimer); tTimer = setTimeout(() => r.set(null), 2000);
};
$('img').onchange = e => {
  const f = e.target.files[0]; if(!f || !open) return; const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => {
    const sc = Math.min(1, 800 / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = im.width * sc; c.height = im.height * sc; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    post({img: c.toDataURL('image/jpeg', 0.6)}, '📷 Photo'); }; im.src = rd.result; };
  rd.readAsDataURL(f); e.target.value = '';
};
document.addEventListener('visibilitychange', () => {
  if(!open || !visible()) return;
  cref.limitToLast(30).once('value', s => s.forEach(c => { const m = c.val(); if(m.f !== me.id && m.s < 3) c.ref.update({s: 3}); }));
  db.ref('userChats/' + me.id + '/' + open + '/unread').set(0);
});
$('back').onclick = () => { if(cref) cref.off(); db.ref('typing/' + cidOf(open) + '/' + open).off(); open = null; cref = null; show('list'); renderList(); };
$('search').oninput = renderList;
$('add').onclick = () => { showAll = !showAll; $('add').textContent = showAll ? '×' : '+'; renderList(); };
$('go').onclick = () => {
  const name = $('name').value.trim(), id = $('phone').value.replace(/\D/g,'');
  if(!name || id.length < 6){ $('err').textContent = 'Barobar nav aani number taka'; return; }
  me = {name, id}; localStorage.setItem('me', JSON.stringify(me)); start();
};
$('out').onclick = () => { if(confirm('Logout karaycha?')){ localStorage.removeItem('me'); location.reload(); } };
if(me) start(); else show('login');
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
